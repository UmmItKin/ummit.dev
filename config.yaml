# Site configuration. Edit this file to toggle features; no code changes needed.
# In `bun dev` changes hot-reload. A production build must be rebuilt to apply.

# Dead Man's Switch — a farewell notice that appears when the site has not been
# rebuilt for `days` days.
deadManSwitch:
  enabled: false # turn the whole feature on or off
  preview: false # force the notice to show now, ignoring the day threshold
  days: 50 # show once the site has not been rebuilt for this many days
